# Checks every push and pull request: type check, production build, a package security audit, then the smoke tests in a real
# browser. A red check here means the change would break the hub; fix it before it reaches Vercel.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      # Known security problems in the packages the live site uses. Reported here (and in the run's
      # annotations) without failing the check until the Next.js 15 upgrade clears the current ones.
      - name: Security audit (packages)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
